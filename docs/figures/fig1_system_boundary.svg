<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" style="font-family: Arial, sans-serif; background: white;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  
  <!-- System boundary dashed rectangle -->
  <rect x="120" y="30" width="440" height="440" rx="12" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="340" y="54" text-anchor="middle" font-size="13" font-weight="600" fill="#222">System boundary: cradle-to-farm gate</text>
  
  <!-- UPSTREAM INPUTS (left side, outside boundary) -->
  <text x="55" y="100" text-anchor="middle" font-size="11" fill="#666">Upstream</text>
  <text x="55" y="116" text-anchor="middle" font-size="11" fill="#666">processes</text>
  
  <!-- Input boxes -->
  <rect x="20" y="140" width="80" height="36" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="0.5"/>
  <text x="60" y="162" text-anchor="middle" font-size="11" fill="#333">Energy</text>
  
  <rect x="20" y="190" width="80" height="36" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="0.5"/>
  <text x="60" y="212" text-anchor="middle" font-size="11" fill="#333">Fertilisers</text>
  
  <rect x="20" y="240" width="80" height="36" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="0.5"/>
  <text x="60" y="262" text-anchor="middle" font-size="11" fill="#333">Pesticides</text>
  
  <rect x="20" y="290" width="80" height="36" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="0.5"/>
  <text x="60" y="312" text-anchor="middle" font-size="11" fill="#333">Water</text>
  
  <rect x="20" y="340" width="80" height="36" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="0.5"/>
  <text x="60" y="362" text-anchor="middle" font-size="11" fill="#333">Materials</text>
  
  <rect x="20" y="390" width="80" height="36" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="0.5"/>
  <text x="60" y="412" text-anchor="middle" font-size="11" fill="#333">Seedlings</text>
  
  <!-- Arrows from inputs to boundary -->
  <line x1="100" y1="158" x2="118" y2="158" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="100" y1="208" x2="118" y2="208" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="100" y1="258" x2="118" y2="258" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="100" y1="308" x2="118" y2="308" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="100" y1="358" x2="118" y2="358" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="100" y1="408" x2="118" y2="408" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  
  <!-- PRODUCTION SYSTEMS (inside boundary) -->
  <text x="245" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Protected cultivation systems</text>
  
  <!-- Polytunnel - light blue -->
  <rect x="145" y="108" width="90" height="44" rx="6" fill="#E6F3FA" stroke="#3B8BD4" stroke-width="0.5"/>
  <text x="190" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#0C447C">Polytunnel</text>
  <text x="190" y="142" text-anchor="middle" font-size="10" fill="#185FA5">n = 73</text>
  
  <!-- Heated GH - light orange -->
  <rect x="250" y="108" width="90" height="44" rx="6" fill="#FFF4E6" stroke="#D97706" stroke-width="0.5"/>
  <text x="295" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#854F0B">Heated GH</text>
  <text x="295" y="142" text-anchor="middle" font-size="10" fill="#BA7517">n = 24</text>
  
  <!-- Non-heated GH - light green -->
  <rect x="355" y="108" width="100" height="44" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="405" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#27500A">Non-heated GH</text>
  <text x="405" y="142" text-anchor="middle" font-size="10" fill="#3B6D11">n = 20</text>
  
  <!-- FARM OPERATIONS (center, inside boundary) -->
  <rect x="175" y="180" width="200" height="50" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="275" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#633806">Farm operations</text>
  <text x="275" y="220" text-anchor="middle" font-size="10" fill="#854F0B">Cultivation, irrigation, fertigation</text>
  
  <!-- Arrow from systems to operations -->
  <line x1="275" y1="152" x2="275" y2="178" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  
  <!-- FIELD EMISSIONS (inside boundary, right side) -->
  <text x="480" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Field emissions</text>
  
  <rect x="420" y="195" width="120" height="36" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="480" y="217" text-anchor="middle" font-size="10" fill="#712B13">N₂O (direct + indirect)</text>
  
  <rect x="420" y="245" width="120" height="36" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="480" y="271" text-anchor="middle" font-size="10" fill="#712B13">NH₃ volatilisation</text>
  
  <rect x="420" y="295" width="120" height="36" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="480" y="321" text-anchor="middle" font-size="10" fill="#712B13">NO₃⁻ leaching</text>
  
  <!-- Arrow from operations to emissions -->
  <line x1="375" y1="205" x2="418" y2="213" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  
  <!-- FUNCTIONAL UNIT / OUTPUT -->
  <rect x="200" y="280" width="150" height="56" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="275" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#173404">Functional unit</text>
  <text x="275" y="320" text-anchor="middle" font-size="10" fill="#27500A">1 kg strawberries</text>
  <text x="275" y="336" text-anchor="middle" font-size="10" fill="#27500A">at farm gate</text>
  
  <!-- Arrow from operations to FU -->
  <line x1="275" y1="230" x2="275" y2="278" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
  
  <!-- EXCLUDED PROCESSES (bottom, inside boundary but greyed) -->
  <rect x="145" y="370" width="310" height="80" rx="8" fill="none" stroke="#999" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="300" y="392" text-anchor="middle" font-size="10" fill="#888">Excluded from system boundary</text>
  
  <rect x="160" y="405" width="90" height="32" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>
  <text x="205" y="425" text-anchor="middle" font-size="10" fill="#888">Transport</text>
  
  <rect x="265" y="405" width="90" height="32" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>
  <text x="310" y="425" text-anchor="middle" font-size="10" fill="#888">Packaging</text>
  
  <rect x="370" y="405" width="70" height="32" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>
  <text x="405" y="425" text-anchor="middle" font-size="10" fill="#888">Retail</text>
  
  <!-- Emissions arrow to air (outside boundary) -->
  <line x1="540" y1="263" x2="580" y2="263" stroke="#D85A30" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="620" y="250" text-anchor="middle" font-size="10" fill="#666">to air</text>
  <text x="620" y="266" text-anchor="middle" font-size="10" fill="#666">&amp; water</text>
  
  <!-- Figure caption -->
  <text x="340" y="500" text-anchor="middle" font-size="11" fill="#666">Fig. 1. System boundary for cradle-to-farm gate LCA of UK strawberry production</text>
</svg>